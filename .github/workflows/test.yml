name: Test

on:
  push:
    branches:
      - master
  pull_request:

jobs:
  ios-distribution-tests:
    name: iOS distribution routing
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
      - run: ruby mobile/ios/App/fastlane/tests/preview_distribution_test.rb

  # Decides which costly jobs below the change can affect: the Mac localization check runs only when
  # its own inputs move, and the web jobs only when a pull request touches what they read.
  detect-changes:
    name: Detect changes
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      swift-catalogs: ${{ steps.filter.outputs.swift-catalogs }}
      web: ${{ steps.filter.outputs.web }}
      agent-v2-e2e: ${{ steps.filter.outputs.agent-v2-e2e }}
      web-funnel-storage: ${{ steps.filter.outputs.web-funnel-storage }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A pull request needs only its merge commit and the base tip, while the push window below
          # starts as far back as the push carried commits.
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 0 }}
          persist-credentials: false

      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_BEFORE: ${{ github.event.before }}
        run: |
          # The Swift catalog test reads exactly two places: the locale sources it generates the
          # catalog from (LOCALES_DIR in test_import_localizations.py) and the importer and tests
          # themselves. Workflow edits also run it to verify changes to the selected toolchain.
          #
          # On a pull request the checkout is a merge commit whose first parent is the base tip,
          # so HEAD~1 is the whole PR. On a push it is only the tip commit, and a push carrying
          # several commits can change the locales in one of the earlier ones while the tip
          # touches something unrelated, so the range starts at the revision the push event
          # itself reports. A new branch reports an all-zero revision and a force-push can report
          # one this clone no longer has; both leave nothing to compare against, and that runs
          # the check rather than guessing.
          BASE="HEAD~1"
          if [ "$EVENT_NAME" = "push" ]; then
            BASE="$PUSH_BEFORE"
          fi

          # A push to master runs every web job, which also catches what a wrong skip let through
          WEB="true"
          if [ "$EVENT_NAME" = "pull_request" ] && bash dev/web-untouched.sh actions "$BASE" HEAD; then
            WEB="false"
          fi
          echo "web=$WEB" >> "$GITHUB_OUTPUT"
          echo "web=$WEB"

          # Agent E2E runs for changes to its source and build inputs; a push runs it regardless of the diff.
          AGENT_V2_E2E="true"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if [ "$WEB" = "false" ] || bash dev/agentV2/e2e-untouched.sh "$BASE" HEAD; then
              AGENT_V2_E2E="false"
            fi
          fi
          echo "agent-v2-e2e=$AGENT_V2_E2E" >> "$GITHUB_OUTPUT"
          echo "agent-v2-e2e=$AGENT_V2_E2E"

          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            echo "No usable base revision ($EVENT_NAME, ${BASE:-empty}) - running the remaining checks"
            echo "swift-catalogs=true" >> "$GITHUB_OUTPUT"
            echo "web-funnel-storage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if ! CHANGED=$(git -c core.quotePath=false diff --name-only --no-renames "$BASE" HEAD); then
            echo "Cannot read changed paths - running the remaining checks"
            echo "swift-catalogs=true" >> "$GITHUB_OUTPUT"
            echo "web-funnel-storage=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # The funnel fixture reads only these storage modules and its installed dependencies.
          WEB_FUNNEL_STORAGE="true"
          if [ "$EVENT_NAME" = "pull_request" ] && [ -n "$CHANGED" ]; then
            WEB_FUNNEL_STORAGE="false"
          fi
          SWIFT_CATALOGS="false"
          while IFS= read -r file; do
            case "$file" in
              src/i18n/*|mobile/ios/Air/scripts/strings/*|.github/workflows/test.yml) SWIFT_CATALOGS="true" ;;
            esac
            case "$file" in
              dev/testWebFunnelStorage.mjs|src/api/storages/idb.ts|src/api/storages/webFunnel.ts|src/api/storages/webFunnelState.ts|package.json|package-lock.json|.github/workflows/test.yml) WEB_FUNNEL_STORAGE="true" ;;
            esac
          done <<< "$CHANGED"

          echo "swift-catalogs=$SWIFT_CATALOGS" >> "$GITHUB_OUTPUT"
          echo "web-funnel-storage=$WEB_FUNNEL_STORAGE" >> "$GITHUB_OUTPUT"
          echo "Changed files:"
          echo "$CHANGED"
          echo "swift-catalogs=$SWIFT_CATALOGS"
          echo "web-funnel-storage=$WEB_FUNNEL_STORAGE"

  localizations:
    name: Localization health
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install localization dependencies
        id: localization-dependencies
        run: python -m pip install -r mobile/ios/Air/scripts/strings/requirements.txt

      - name: Test localization health checker
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python -m unittest discover -s dev/locales -p 'test_*.py' -v

      - name: Check catalogs and localization call sites
        if: ${{ !cancelled() && steps.localization-dependencies.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: python dev/locales/check_localization_health.py

  # Compiles the generated L10n.swift against the compiled catalog and runs it, which takes
  # xcstringstool and swiftc and therefore a Mac. Split off from the checks above, which are pure
  # Python and were paying the Mac rate to sit next to it.
  ios-localizations:
    name: Localization health (Swift catalogs)
    permissions:
      contents: read
    needs: detect-changes
    if: ${{ needs.detect-changes.outputs.swift-catalogs == 'true' }}
    # Match the explicitly selected Xcode 27.1 toolchain used for iOS releases.
    runs-on: xcode-27
    timeout-minutes: 10
    env:
      DEVELOPER_DIR: /Applications/Xcode_27.1.app/Contents/Developer
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install localization dependencies
        id: localization-dependencies
        run: python -m pip install -r mobile/ios/Air/scripts/strings/requirements.txt

      - name: Test iOS localization generation and Foundation formatting
        if: ${{ !cancelled() && steps.localization-dependencies.outcome == 'success' }}
        env:
          PYTHONDONTWRITEBYTECODE: '1'
        run: |
          xcodebuild -version
          xcrun swiftc --version
          python -m unittest discover -s mobile/ios/Air/scripts/strings -p 'test_*.py' -v

  test:
    name: Simple tests
    permissions:
      contents: read
    needs: detect-changes
    # A failed detection leaves the output empty, and that runs the job
    if: ${{ !cancelled() && needs.detect-changes.outputs.web != 'false' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Prepare default translations
        run: npm run i18n:build:default

      - name: Check types and lint
        env:
          # ESLint outgrows the default heap of about 2 GB. npm replaces `NODE_OPTIONS` with its `node-options` config
          npm_config_node_options: --no-experimental-strip-types --max-old-space-size=4096
        run: npm run check

      - name: Test filename lint and autofix
        run: npm run test:file-names

      - name: Test extension license distribution
        run: npm run test:extension-licenses

      - name: Test iOS signing expiry schedule
        run: npm run test:signing-schedule

      - name: Test web change detection
        run: npm run test:web-untouched

      - name: Test the PR title check
        run: npm run test:pr-title

      - name: Test the E2E broadcast guard
        run: npm run test:broadcast-guard

      - name: Test the E2E testnet proxy
        run: npm run test:testnet-proxy

      - name: Test
        run: npm test

      - name: Check Agent V2 contracts
        run: npm run contract:agent:v2:check

      - name: Test Agent V2 E2E change detection
        run: node --test dev/agentV2/e2e-untouched-tests.mjs

      # The standalone Air SDK sets `NO_EXTRA_FEATURES=1` to exclude guarded extra features from the bundle
      - name: Build the standalone SDK bundle
        run: npm run sdk:build:slim

  chromium-e2e:
    name: Agent V2 / Chromium E2E
    permissions:
      contents: read
    needs: detect-changes
    if: ${{ !cancelled() && (needs.detect-changes.outputs.agent-v2-e2e != 'false' || needs.detect-changes.outputs.web-funnel-storage != 'false') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Prepare default translations
        if: ${{ needs.detect-changes.outputs.agent-v2-e2e != 'false' }}
        run: npm run i18n:build:default

      - name: Install Chromium
        if: ${{ needs.detect-changes.outputs.agent-v2-e2e != 'false' || needs.detect-changes.outputs.web-funnel-storage != 'false' }}
        run: npx --no-install playwright install --with-deps chromium

      - name: Test Web funnel IndexedDB concurrency
        if: ${{ needs.detect-changes.outputs.web-funnel-storage != 'false' }}
        run: npm run test:web-funnel-storage

      - name: Run Agent V2 Chromium E2E
        if: ${{ needs.detect-changes.outputs.agent-v2-e2e != 'false' }}
        run: npm run test:agent:v2:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() && needs.detect-changes.outputs.agent-v2-e2e != 'false' }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-v2-playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7

  # Gram Web and Chrome ship only through ton-blockchain/ton-wallet, which rejects an artifact its own
  # validators fail. This job builds both the way the receiver does; the next one runs those validators.
  gram-build:
    name: Gram production build
    permissions:
      contents: read
    needs: detect-changes
    if: ${{ !cancelled() && github.event_name == 'pull_request' && needs.detect-changes.outputs.web != 'false' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact-id: ${{ steps.upload.outputs.artifact-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Prepare default translations
        run: npm run i18n:build:default

      - name: Build Gram Web and Chrome for production
        run: |
          mkdir -p "$RUNNER_TEMP/gram"
          npm run gram:build:production
          mv dist "$RUNNER_TEMP/gram/web"
          npm run gram:extension-chrome:package:production
          mv MyWallet-chrome.zip "$RUNNER_TEMP/gram/chrome.zip"

      - name: Upload Gram artifacts
        id: upload
        uses: actions/upload-artifact@v4
        with:
          name: gram-production-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/gram
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3

  # The validators are code from another repository's default branch, so they run without a token, a
  # package cache or this repository's source, and only on pull requests, whose cache scope master never reads.
  gram-receiver-policy:
    name: Gram receiver policy
    permissions: {}
    needs: gram-build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Fetch the receiver's validators
        run: git clone --depth 1 https://github.com/ton-blockchain/ton-wallet.git receiver

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Download Gram artifacts
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ needs.gram-build.outputs.artifact-id }}
          merge-multiple: true
          path: gram

      - name: Read the built version
        id: version
        run: |
          version=$(cat gram/web/version.txt)
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Validate Gram Web
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node receiver/scripts/validate-web.mjs gram/web "$VERSION"

      - name: Validate Gram Chrome
        if: ${{ !cancelled() && steps.version.outcome == 'success' }}
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: node receiver/scripts/validate-chrome.mjs gram/chrome.zip "$VERSION"
