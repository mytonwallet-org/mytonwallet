name: Release Gram Wallet

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      expected_sha:
        description: Full public master SHA to release
        type: string
        required: true
      mode:
        description: Check artifacts or deploy web and submit Chrome for staged review
        type: choice
        options: [check, stage]
        default: check
        required: true
      rollout_percentage:
        description: Initial Chrome rollout percentage
        type: string
        default: '5'
        required: true

permissions:
  contents: read

jobs:
  dispatch:
    name: Dispatch and await Gram release
    if: >-
      github.repository == 'mytonwallet-org/mytonwallet' &&
      (github.event_name == 'workflow_dispatch' || vars.GRAM_RELEASE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 95
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Test dispatcher boundaries
        run: node --test dev/gramReleaseDispatchTests.mjs

      - name: Dispatch and await receiver
        id: receiver
        env:
          TON_WALLET_ACTIONS_TOKEN: ${{ secrets.TON_WALLET_DEPLOY_TOKEN }}
          GRAM_RELEASE_ENABLED: ${{ vars.GRAM_RELEASE_ENABLED }}
          EXPECTED_SHA: ${{ inputs.expected_sha }}
          RELEASE_MODE: ${{ inputs.mode }}
          ROLLOUT_PERCENTAGE: ${{ inputs.rollout_percentage || '5' }}
        run: node deploy/dispatch_gram_release.mjs
