name: Bump PR approval

# The release bot opens one mechanical pull request per patch - the version bump on master - and a
# human approval on a three-file diff that `npm version` wrote adds nothing but latency to the
# release. This workflow signs off on exactly that shape of pull request, and the bot merges it with
# its own token once the approval and the required checks are in - a merge performed by GITHUB_TOKEN
# would push to master without triggering any of the workflows a master push runs.
#
# The guard below is the whole safety story: author, base, title and, above all, the diff. Anything
# that fails a single check is left untouched for a human, including any other pull request the bot
# may open, so the approval can never travel to a change nobody read.

on:
  pull_request_target:
    types: [opened, reopened, synchronize]
  # The guard is otherwise only exercised during a release; this runs it against an existing pull
  # request and reports the verdict without approving anything.
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request to check the guard against, without approving it
        required: true

# The head branch is never checked out or executed here, so `pull_request_target` hands its author
# no access to the write permissions below.
permissions:
  contents: read
  pull-requests: write

jobs:
  approve:
    name: Approve a version bump
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/github-script@v9
        env:
          DRY_RUN_PR: ${{ inputs.pr_number }}
        with:
          script: |
            // The only account that opens version-bump pull requests; see `bumpDevVersion` in
            // mytonwallet-org/my-deployer, which waits on this approval to merge one.
            const BOT_LOGIN = 'my-deployer';
            const BASE_BRANCH = 'master';
            const TITLE_PATTERN = /^Bump version to (\d+\.\d+\.\d+)$/;
            // A touched line is allowed to be the version and nothing else, and the version it
            // carries is captured to be compared in full: a line merely containing the title's
            // version would pass both `"postinstall": "sh evil # 26.8.7"` and a bump to 26.8.70.
            const VERSION_FIELD_PATTERN = /^[+-]\s*"version": "(\d+\.\d+\.\d+)",?$/;
            // `npm version` writes a single boilerplate line, with room for a hand-written one.
            const CHANGELOG_MAX_LINES = 5;

            const dryRunPr = process.env.DRY_RUN_PR;
            if (dryRunPr && !/^\d+$/.test(dryRunPr)) {
              core.setFailed(`Expected a pull request number, got ${JSON.stringify(dryRunPr)}`);
              return;
            }

            const prNumber = dryRunPr ? Number(dryRunPr) : context.payload.pull_request.number;
            const prRef = { owner: context.repo.owner, repo: context.repo.repo, pull_number: prNumber };

            // The event payload is a snapshot from when the event fired, so the title and head are
            // read fresh: a pull request edited between the push and this run cannot slip through.
            const { data: pr } = await github.rest.pulls.get(prRef);

            const decline = (reason) => core.info(`Leaving #${prNumber} to a human: ${reason}`);

            if (pr.user.login !== BOT_LOGIN) return decline(`opened by ${pr.user.login}`);
            if (pr.base.ref !== BASE_BRANCH) return decline(`targets ${pr.base.ref}`);
            if (pr.state !== 'open') return decline(`state is ${pr.state}`);
            if (pr.draft) return decline('still a draft');

            const titleMatch = TITLE_PATTERN.exec(pr.title);
            if (!titleMatch) return decline(`title is ${JSON.stringify(pr.title)}`);

            const version = titleMatch[1];

            // The approval rests entirely on the diff being the mechanical bump: a fixed file set,
            // and every touched line in it being a version line - the one introduced or the one it
            // replaces. A bump smuggling a code change alongside fails one of these.
            //
            // The served `version.txt` is absent from this set by design: the webpack build emits it
            // from the same `package.json` version, so no checked-in copy of it exists for a bump to
            // touch, and listing it here would decline every bump for being a file short.
            const expectedFiles = new Map([
              ['package.json', { status: 'modified', line: VERSION_FIELD_PATTERN }],
              ['package-lock.json', { status: 'modified', line: VERSION_FIELD_PATTERN }],
              [`changelogs/${version}.txt`, { status: 'added' }],
            ]);

            const files = await github.paginate(github.rest.pulls.listFiles, { ...prRef, per_page: 100 });
            if (files.length !== expectedFiles.size) return decline(`touches ${files.length} files`);

            for (const file of files) {
              const expected = expectedFiles.get(file.filename);
              if (!expected) return decline(`touches ${file.filename}`);
              if (file.status !== expected.status) return decline(`${file.filename} is ${file.status}`);

              // GitHub drops the patch on large diffs, and a bump is a handful of lines - a missing
              // patch means this is something else, so fail closed rather than approve it unread.
              if (!file.patch) return decline(`carries no readable patch for ${file.filename}`);

              const changedLines = file.patch
                .split('\n')
                .filter((line) => /^[+-]/.test(line) && !/^(\+\+\+|---)/.test(line));

              // `changes` is GitHub's own count for the file, so a patch that arrives short of it
              // cannot pass as a diff that was read whole
              if (changedLines.length !== file.changes) {
                return decline(`${file.filename} shows ${changedLines.length} of ${file.changes} changed lines`);
              }

              // The changelog is a new file `npm version` fills with boilerplate, so it has no
              // version line to match - its size is what keeps it from carrying anything else.
              if (!expected.line) {
                if (changedLines.length > CHANGELOG_MAX_LINES) {
                  return decline(`${file.filename} spans ${changedLines.length} lines`);
                }

                continue;
              }

              for (const line of changedLines) {
                const lineMatch = expected.line.exec(line);
                if (!lineMatch) {
                  return decline(`${file.filename} touches a line that is not a version: ${line.trim()}`);
                }

                if (line.startsWith('+') && lineMatch[1] !== version) {
                  return decline(`${file.filename} introduces ${lineMatch[1]}, not ${version}`);
                }
              }
            }

            if (dryRunPr) {
              core.notice(`#${prNumber} is a clean version bump to ${version}; the dry run stops here`);
              return;
            }

            // A force-push dismisses our review, hence the re-approval on `synchronize`; a standing
            // one for the current head is left alone so a re-run does not stack duplicates.
            const reviews = await github.paginate(github.rest.pulls.listReviews, { ...prRef, per_page: 100 });
            const isApproved = reviews.some((review) => (
              review.user.login === 'github-actions[bot]'
              && review.state === 'APPROVED'
              && review.commit_id === pr.head.sha
            ));

            if (isApproved) {
              core.info(`#${prNumber} already carries an approval for ${pr.head.sha}`);
              return;
            }

            await github.rest.pulls.createReview({
              ...prRef,
              event: 'APPROVE',
              body: `Mechanical version bump to ${version}, approved automatically.`,
            });

            core.notice(`Approved the version bump to ${version}`);
