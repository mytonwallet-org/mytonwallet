name: Agent V2 E2E

# A pull request runs the suite when it touches the Agent, the suite or the build. Master runs it every two hours
# when the shared code the Agent screens execute moved since the last green run there.
on:
  pull_request:
  schedule:
    - cron: "37 */2 * * *"
  workflow_dispatch:

concurrency:
  # A manual run never waits in a shared group, where a later run would replace it
  group: ${{ github.workflow }}-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  detect-changes:
    name: Detect changes
    permissions:
      contents: read
      actions: read
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      run: ${{ steps.filter.outputs.run }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # A pull request checkout is a merge commit whose first parent is the base tip
          fetch-depth: ${{ github.event_name == 'pull_request' && 2 || 1 }}
          # Only the scheduled run fetches its base; pull request code never sees the token
          persist-credentials: ${{ github.event_name == 'schedule' }}

      - name: Check changed paths
        id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          GH_TOKEN: ${{ github.event_name == 'schedule' && github.token || '' }}
        run: |
          RUN="true"
          if [ "$EVENT_NAME" = "pull_request" ]; then
            if bash dev/agentV2/e2e-untouched.sh pr HEAD~1 HEAD; then
              RUN="false"
            fi
          elif [ "$EVENT_NAME" = "schedule" ]; then
            # A failed run is not a base, so a red master runs again on every schedule until it is green
            BASE=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/agent-v2-e2e.yml/runs?branch=master&status=success&per_page=50" \
              --jq '[.workflow_runs[] | select(.event == "schedule" or .event == "workflow_dispatch")][0].head_sha // empty') || BASE=""
            echo "Last green master run: ${BASE:-none}"
            if [ "$BASE" = "$GITHUB_SHA" ]; then
              RUN="false"
            elif [ -n "$BASE" ] && git fetch --quiet --depth=1 origin "$BASE" \
              && bash dev/agentV2/e2e-untouched.sh master "$BASE" HEAD; then
              RUN="false"
            fi
          fi
          echo "run=$RUN" >> "$GITHUB_OUTPUT"
          echo "run=$RUN"

  # No concurrency of its own: the workflow group cancels it with the rest of a superseded run
  settle:
    name: Wait for a quiet window
    permissions:
      contents: read
      pull-requests: read
    needs: detect-changes
    if: ${{ github.event_name == 'pull_request' && needs.detect-changes.outputs.run != 'false' }}
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      current: ${{ steps.head.outputs.current }}
    steps:
      - name: Checkout the settle module
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            dev/ciSettle.mjs
            .github/ci-settle.json
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Wait and check the pull request head
        id: head
        uses: actions/github-script@v9
        with:
          script: |
            const { settlePullRequest } = await import(`${process.env.GITHUB_WORKSPACE}/dev/ciSettle.mjs`);
            core.setOutput('current', await settlePullRequest({ github, context, core, job: 'agentV2E2e' }));

  chromium-e2e:
    name: Agent V2 / Chromium E2E
    permissions:
      contents: read
    needs: [detect-changes, settle]
    # A failed detection leaves the output empty, and that runs the job; so does a failed wait
    if: >-
      ${{ !cancelled() && needs.detect-changes.outputs.run != 'false'
      && (needs.settle.result != 'success' || needs.settle.outputs.current == 'true') }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Prepare the Node environment
        uses: mytonwallet-org/shared-actions/prepare_node@master
        with:
          node-version: ${{ vars.NODE_VERSION }}

      - name: Prepare default translations
        run: npm run i18n:build:default

      - name: Install Chromium
        # The runner image ships every shared library Chromium needs, so the step stays off `apt`
        timeout-minutes: 3
        run: npx --no-install playwright install chromium

      - name: Run Agent V2 Chromium E2E
        run: npm run test:agent:v2:e2e

      - name: Upload Playwright diagnostics
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: agent-v2-playwright-diagnostics
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
