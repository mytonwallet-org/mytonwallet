name: Android ktlint

# The ktlint Gradle plugin is applied to every Android subproject, but nothing used
# to fail a red merge, so master drifted out of style unnoticed.

on:
  push:
    branches:
      - master
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ktlint:
    name: ktlint
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # The default token is contents-only, and listing a pull request's files needs more.
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # A workflow-level paths filter would leave the check unreported on unrelated
      # pull requests, and an unreported required check blocks the merge forever, so
      # the job always reports and narrows itself from the inside instead.
      - name: Look for Android changes
        id: scope
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          if [ "${{ github.event_name }}" != "pull_request" ]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          CHANGED=$(gh api "repos/${{ github.repository }}/pulls/$PR_NUMBER/files" --paginate --jq '.[].filename')
          RELEVANT=false
          while IFS= read -r file; do
            case "$file" in
              mobile/android/*|.github/workflows/android-ktlint.yml) RELEVANT=true ;;
            esac
          done <<< "$CHANGED"

          echo "relevant=$RELEVANT" >> "$GITHUB_OUTPUT"
          echo "Android sources touched: $RELEVANT"

      - name: Set up JDK 21
        if: steps.scope.outputs.relevant == 'true'
        uses: actions/setup-java@v4
        with:
          java-version: "21"
          distribution: "temurin"

      - name: Set up Gradle with build cache
        if: steps.scope.outputs.relevant == 'true'
        uses: gradle/actions/setup-gradle@v4
        with:
          # Without a key the action silently declines to carry the configuration
          # cache between runs, and this build spends over a minute configuring.
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      # The Gradle build is self-contained: no Capacitor sync, so no Node step here.
      - name: Check Kotlin code style
        if: steps.scope.outputs.relevant == 'true'
        working-directory: mobile/android
        run: ./gradlew ktlintCheck
