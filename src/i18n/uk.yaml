$auth_responsibly_description1: |
  %app_name% - це **некастодіальний** гаманець, що означає, що **тільки ви** маєте повний контроль і, найголовніше, **повну відповідальність** за свої кошти.
$auth_responsibly_description2: |
  Ваші закриті ключі зберігаються на вашому пристрої і можуть бути схильні до **хакерських атак**. Якщо ваш комп'ютер заражений **шкідливою програмою**, ваші кошти можуть бути вкрадені.
$auth_responsibly_description3: |
  Команда %app_name% **не несе відповідальності** за збереження ваших коштів, як і виробник вашого комп'ютера або інтернет-провайдер.
$auth_responsibly_description4: |
  **Ніколи** не зберігайте всі свої кошти в одному місці. **Урізноманітьте** і використовуйте різне програмне та апаратне забезпечення. Завжди **проводьте власні дослідження** і дізнавайтеся більше про криптобезпеку.
