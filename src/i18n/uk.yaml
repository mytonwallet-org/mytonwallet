$enclave_migration_unexpected_title: Не вдалося завершити оновлення
$enclave_migration_unexpected_message: |
  Оновлення даних гаманця зупинилося через непередбачену помилку, і застосунок не може визначити її причину. Нічого не видалено: усі ваші гаманці досі зберігаються на цьому пристрої.

  Закрийте це повідомлення й спробуйте ще раз — ще одна спроба не зашкодить вашим гаманцям. Якщо оновлення й далі зупинятиметься, не перевстановлюйте застосунок і не очищайте його дані. Надішліть цей код у %support_link%: %error_code%
$enclave_migration_retry_title: Оновлення не завершено
$enclave_migration_retry_message: |
  Оновлення даних гаманця зупинилося до завершення. Нічого не видалено: усі ваші гаманці досі зберігаються на цьому пристрої.

  Закрийте це повідомлення й спробуйте ще раз — ще одна спроба не зашкодить вашим гаманцям. Якщо оновлення й далі зупинятиметься, не перевстановлюйте застосунок і не очищайте його дані. Надішліть цей код у %support_link%: %error_code%
$enclave_migration_storage_full_title: Недостатньо місця
$enclave_migration_storage_full_message: |
  Для оновлення даних гаманця потрібно більше вільного місця, ніж залишилося на цьому пристрої, тому оновлення зупинилося. Нічого не видалено: усі ваші гаманці досі зберігаються на цьому пристрої.

  Звільніть трохи місця й знову відкрийте застосунок. Не перевстановлюйте застосунок і не очищайте його дані: це видалить гаманці, які досі цілі.
