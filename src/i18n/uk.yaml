$domain_like_scam_warning: |
  Введена адреса, ймовірно, **ШАХРАЙСТВО**. Це **НЕ** адреса жодної біржі або вашого гаманця токенів.

  Це довгий **домен**, який **шахраї** використовують, щоб переконати людей, що вони надсилають токени на відому адресу.

  **Скасуйте** цей переказ і **ніколи** не довіряйте незнайомцям. Дізнайтеся більше про цю та інші шахрайські схеми в нашiй %help_center_link%.
