$enclave_migration_damaged_title: Дані гаманця пошкоджено
$enclave_migration_damaged_message: |
  Річ не в паролі. Збережені дані одного з ваших гаманців не читаються, тому оновлення зупинилося, а решта гаманців залишилася в попередньому форматі.

  Не перевстановлюйте застосунок і не очищайте його дані: це видалить гаманці, які ще цілі. Будь ласка, зв'яжіться з %support_link%, і ми допоможемо їх відновити.
$enclave_recovery_required_tooltip: Збережені дані цього гаманця не читаються. Не видаляйте цей гаманець і не очищайте дані застосунку, а щодо відновлення зв'яжіться з підтримкою.
$logout_recovery_required_warning: Збережені дані цього гаманця не читаються, тому показати його секретні слова неможливо. Видалення знищить єдину копію, що залишилася на цьому пристрої, і без секретних слів гаманець не відновити.
$logout_recovery_required_accounts_warning: Збережені дані %links% не читаються, тому показати секретні слова неможливо. Видалення знищить єдину копію цих гаманців, що залишилася на цьому пристрої, і без секретних слів їх не відновити.
$enclave_migration_interrupted_title: Оновлення було перервано
$enclave_migration_interrupted_message: |
  Попередня спроба оновити дані гаманця зупинилася на середині, і продовжити її з цього екрана неможливо. Повторне введення тут не допоможе.

  Не перевстановлюйте застосунок і не очищайте його дані: ваші гаманці досі зберігаються на цьому пристрої. Будь ласка, зв'яжіться з %support_link%, і ми допоможемо завершити оновлення.
