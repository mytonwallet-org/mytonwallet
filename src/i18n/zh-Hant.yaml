$enclave_data_missing_message: |
  這不是密碼問題。本應用程式在此裝置上用於驗證密碼並開啟錢包的資料已遺失，因此在這裡任何密碼都無法解鎖。

  請不要重新安裝應用程式，也不要在系統設定中清除其資料。請用下方按鈕匯出日誌並傳送給 %support_link%，我們可以據此了解此裝置上發生了什麼。

  如果您有錢包的密語，可以退出所有錢包並重新匯入。

