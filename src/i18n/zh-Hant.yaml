$enclave_migration_unexpected_title: 無法完成更新
$enclave_migration_unexpected_message: |
  錢包資料更新因意外錯誤而停止，應用程式無法確定錯誤原因。沒有刪除任何內容：您的所有錢包仍儲存在本裝置上。

  關閉此訊息並重試，再次嘗試不會損壞您的錢包。如果更新仍然停止，請不要重新安裝應用程式，也不要清除其資料，並將此代碼傳送給 %support_link%：%error_code%
$enclave_migration_retry_title: 更新未完成
$enclave_migration_retry_message: |
  錢包資料更新在完成前停止。沒有刪除任何內容：您的所有錢包仍儲存在本裝置上。

  關閉此訊息並重試，再次嘗試不會損壞您的錢包。如果更新仍然停止，請不要重新安裝應用程式，也不要清除其資料，並將此代碼傳送給 %support_link%：%error_code%
$enclave_migration_storage_full_title: 空間不足
$enclave_migration_storage_full_message: |
  更新錢包資料所需的可用空間超過本裝置的剩餘空間，因此更新已停止。沒有刪除任何內容：您的所有錢包仍儲存在本裝置上。

  請釋放一些空間，然後重新開啟應用程式。請不要重新安裝應用程式，也不要清除其資料，否則仍然完好的錢包會被抹除。
