Use Responsibly: Usa responsabilmente
$auth_responsibly_description1: |
  %app_name% è un wallet **non-custodial**, il che significa che **solo tu** hai il pieno controllo e, soprattutto, la **piena responsabilità** dei tuoi fondi.
$auth_responsibly_description2: |
  Le tue chiavi private sono memorizzate sul tuo dispositivo e sono esposte ad **attacchi hacker**. Se il tuo computer viene infettato da un **malware**, è molto probabile che i tuoi fondi vengano rubati.
$auth_responsibly_description3: |
  Il team di %app_name% **non è responsabile** della sicurezza dei tuoi fondi, così come non lo sono il produttore del tuo computer o il tuo fornitore di servizi internet.
$auth_responsibly_description4: |
  **Non** conservare mai tutti i tuoi fondi nello stesso posto. **Diversifica** e usa soluzioni software e hardware differenti. Fai sempre **le tue ricerche** e approfondisci la sicurezza delle cripto.
Start Wallet: Avvia wallet
