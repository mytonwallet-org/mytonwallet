$enclave_migration_damaged_title: Dati del wallet danneggiati
$enclave_migration_damaged_message: |
  Non si tratta di un problema di password. I dati memorizzati di uno dei tuoi wallet non possono essere letti, quindi l'aggiornamento è stato interrotto e gli altri tuoi wallet sono rimasti nel formato precedente.
  
  Non reinstallare l'app e non cancellarne i dati: questo eliminerebbe i wallet ancora intatti. Contatta %support_link% e ti aiuteremo a recuperarli.
$enclave_recovery_required_tooltip: I dati salvati di questo wallet non possono essere letti. Non rimuovere questo wallet e non cancellare i dati dell'app, e contatta l'assistenza per recuperarlo.
$logout_recovery_required_warning: I dati salvati di questo wallet non possono essere letti, quindi non è possibile visualizzare le sue parole segrete. Rimuovendo il wallet si distrugge l'unica copia rimasta su questo dispositivo, e non potrà essere ripristinato senza le parole segrete.
$logout_recovery_required_accounts_warning: I dati salvati di %links% non possono essere letti, quindi non è possibile visualizzare le parole segrete. La rimozione distrugge l'unica copia di tali wallet rimasta su questo dispositivo, e non potranno essere ripristinati senza le parole segrete.
$enclave_migration_interrupted_title: L'aggiornamento è stato interrotto
$enclave_migration_interrupted_message: |
  Un precedente tentativo di aggiornare i dati del tuo wallet si è interrotto a metà e non può essere ripreso da questa schermata. Riprovare qui non sarà d'aiuto.
  
  Non reinstallare l'app e non cancellarne i dati: i tuoi wallet sono ancora memorizzati su questo dispositivo. Contatta %support_link% e ti aiuteremo a completare l'aggiornamento.
$enclave_migration_unexpected_title: Impossibile completare l'aggiornamento
$enclave_migration_unexpected_message: |
  L'aggiornamento dei dati del tuo wallet si è interrotto a causa di un errore imprevisto e l'app non è in grado di determinare la causa. Non è stato eliminato nulla: ogni wallet è ancora memorizzato su questo dispositivo.
  
  Chiudi questo messaggio e riprova: un altro tentativo non danneggerà i tuoi wallet. Se continua a interrompersi, non reinstallare l'app, non cancellarne i dati e invia questo codice a %support_link%: %error_code%
$enclave_migration_retry_title: L'aggiornamento non è terminato
$enclave_migration_retry_message: |
  L'aggiornamento dei dati del tuo wallet si è interrotto prima di terminare. Non è stato eliminato nulla: ogni wallet è ancora memorizzato su questo dispositivo.
  
  Chiudi questo messaggio e riprova: un altro tentativo non danneggerà i tuoi wallet. Se continua a interrompersi, non reinstallare l'app, non cancellarne i dati e invia questo codice a %support_link%: %error_code%
$enclave_migration_storage_full_title: Spazio insufficiente
$enclave_migration_storage_full_message: |
  L'aggiornamento dei dati del tuo wallet richiede più spazio libero di quello disponibile su questo dispositivo, quindi è stato interrotto. Non è stato eliminato nulla: ogni wallet è ancora memorizzato su questo dispositivo.
  
  Libera dello spazio e riapri l'app. Non reinstallare l'app e non cancellarne i dati: questo eliminerebbe i wallet ancora intatti.
