$domain_like_scam_warning: |
  L'indirizzo inserito è probabilmente una **TRUFFA**. Questo **NON** è l'indirizzo di alcun exchange né del tuo wallet di token.
  
  Si tratta di un lungo **dominio** che i **truffatori** usano per convincere le persone che stanno inviando token a un indirizzo noto.
  
  **Annulla** questo trasferimento e **non fidarti mai** degli sconosciuti. Scopri di più su questa e altre truffe nel nostro %help_center_link%.
