$auth_responsibly_description1: |
  %app_name% یک کیف پول **خودامانی** است، به این معنی که **تنها شما** کنترل کامل و مهم‌تر از همه، **مسئولیت کامل** دارایی‌های خود را دارید.
$auth_responsibly_description2: |
  کلیدهای خصوصی شما روی دستگاه‌تان ذخیره می‌شوند و در معرض **حملات هکری** هستند. اگر رایانه شما به **بدافزار** آلوده شود، احتمال سرقت دارایی‌های شما وجود دارد.
$auth_responsibly_description3: |
  تیم %app_name% **مسئول** ایمنی دارایی‌های شما **نیست**، همان‌طور که سازنده رایانه یا ارائه‌دهنده اینترنت شما مسئول نیست.
$auth_responsibly_description4: |
  **هرگز** همه دارایی‌های خود را در یک مکان نگه ندارید. **تنوع‌بخشی** کنید و از نرم‌افزارها و سخت‌افزارهای مختلف استفاده کنید. همیشه **تحقیق شخصی** انجام دهید و درباره امنیت کریپتو بیشتر بیاموزید.
