$enclave_migration_damaged_title: داده‌های کیف پول آسیب دیده است
$enclave_migration_damaged_message: |
  مشکل از رمز عبور نیست. داده‌های ذخیره‌شده یکی از کیف پول‌های شما خوانده نمی‌شود، بنابراین به‌روزرسانی متوقف شد و بقیه کیف پول‌های شما در قالب پیشین باقی ماندند.

  برنامه را دوباره نصب نکنید و داده‌های آن را پاک نکنید، چون کیف پول‌هایی که هنوز سالم‌اند از بین می‌روند. لطفاً با %support_link% تماس بگیرید تا در بازیابی آن‌ها کمک کنیم.
$enclave_recovery_required_tooltip: داده‌های ذخیره‌شده این کیف پول خوانده نمی‌شود. این کیف پول را حذف نکنید و داده‌های برنامه را پاک نکنید، و برای بازیابی آن با پشتیبانی تماس بگیرید.
$logout_recovery_required_warning: داده‌های ذخیره‌شده این کیف پول خوانده نمی‌شود، بنابراین کلمات محرمانه آن قابل نمایش نیست. حذف کیف پول تنها نسخه باقی‌مانده روی این دستگاه را از بین می‌برد و بدون کلمات محرمانه بازیابی آن ممکن نیست.
$logout_recovery_required_accounts_warning: داده‌های ذخیره‌شده %links% خوانده نمی‌شود، بنابراین کلمات محرمانه قابل نمایش نیست. حذف، تنها نسخه باقی‌مانده این کیف پول‌ها روی این دستگاه را از بین می‌برد و بدون کلمات محرمانه بازیابی آن‌ها ممکن نیست.
$enclave_migration_interrupted_title: به‌روزرسانی نیمه‌کاره ماند
$enclave_migration_interrupted_message: |
  تلاش پیشین برای به‌روزرسانی داده‌های کیف پول شما در میانه متوقف شد و از این صفحه نمی‌توان آن را ادامه داد. تلاش دوباره در اینجا کمکی نمی‌کند.

  برنامه را دوباره نصب نکنید و داده‌های آن را پاک نکنید، کیف پول‌های شما همچنان روی این دستگاه ذخیره شده‌اند. لطفاً با %support_link% تماس بگیرید تا به‌روزرسانی را کامل کنیم.
$enclave_migration_unexpected_title: تکمیل به‌روزرسانی ممکن نشد
$enclave_migration_unexpected_message: |
  به‌روزرسانی داده‌های کیف پول شما به‌دلیل خطایی غیرمنتظره متوقف شد و برنامه نمی‌تواند علت آن را تشخیص دهد. چیزی حذف نشده است: همه کیف پول‌های شما همچنان روی این دستگاه ذخیره‌اند.

  این پیام را ببندید و دوباره تلاش کنید؛ تلاش دوباره به کیف پول‌های شما آسیبی نمی‌زند. اگر باز هم متوقف شد، برنامه را دوباره نصب نکنید و داده‌های آن را پاک نکنید و این کد را برای %support_link% ارسال کنید: %error_code%
$enclave_migration_retry_title: به‌روزرسانی کامل نشد
$enclave_migration_retry_message: |
  به‌روزرسانی داده‌های کیف پول شما پیش از کامل شدن متوقف شد. چیزی حذف نشده است: همه کیف پول‌های شما همچنان روی این دستگاه ذخیره‌اند.

  این پیام را ببندید و دوباره تلاش کنید؛ تلاش دوباره به کیف پول‌های شما آسیبی نمی‌زند. اگر باز هم متوقف شد، برنامه را دوباره نصب نکنید و داده‌های آن را پاک نکنید و این کد را برای %support_link% ارسال کنید: %error_code%
$enclave_migration_storage_full_title: فضای کافی نیست
$enclave_migration_storage_full_message: |
  به‌روزرسانی داده‌های کیف پول شما به فضای خالی بیشتری از فضای باقی‌مانده روی این دستگاه نیاز دارد، بنابراین متوقف شد. چیزی حذف نشده است: همه کیف پول‌های شما همچنان روی این دستگاه ذخیره‌اند.

  مقداری فضا خالی کنید و برنامه را دوباره باز کنید. برنامه را دوباره نصب نکنید و داده‌های آن را پاک نکنید؛ این کار کیف پول‌هایی را که هنوز سالم‌اند از بین می‌برد.
