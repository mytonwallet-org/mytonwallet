Safety Rules: قوانین ایمنی
$safety_rules_private_key_one: |
  در صفحه بعد **کلید خصوصی %chain%** را خواهید دید. آن را به‌درستی ذخیره کنید و **در مکانی امن نگه دارید**.
$safety_rules_private_key_two: این کلید به شما اجازه می‌دهد در صورت فراموشی رمز عبور یا از دست دادن دسترسی به این دستگاه، **کیف پول خود را باز کنید**.
$safety_rules_private_key_three: اگر هر کس دیگری این کلید خصوصی را ببیند، ممکن است دارایی‌های شما **به سرقت برود**. **آن را برای کسی ارسال یا به کسی نشان ندهید**، حتی به توسعه‌دهندگان یا پشتیبانی فنی.
$safety_rules_one: |
  در صفحه بعد **کلمات محرمانه** را خواهید دید. آن‌ها را به ترتیب درست یادداشت کنید و **در مکانی امن نگه دارید**.
$safety_rules_two: آن‌ها به شما اجازه می‌دهند در صورت فراموشی رمز عبور یا از دست دادن دسترسی به این دستگاه، **کیف پول خود را باز کنید**.
$safety_rules_three: اگر هر کس دیگری این کلمات را ببیند، ممکن است دارایی‌های شما **به سرقت برود**. **آن‌ها را برای کسی ارسال نکنید**، حتی به توسعه‌دهندگان یا پشتیبانی فنی.
