$enclave_migration_damaged_title: بيانات المحفظة تالفة
$enclave_migration_damaged_message: |
  المشكلة ليست في كلمة المرور. تعذّرت قراءة البيانات المحفوظة لإحدى محافظك، لذلك توقّف التحديث وبقيت محافظك الأخرى بالتنسيق السابق.

  لا تعِد تثبيت التطبيق ولا تمسح بياناته، فهذا سيمحو المحافظ التي ما زالت سليمة. يُرجى التواصل مع %support_link% وسنساعدك في استعادتها.
$enclave_recovery_required_tooltip: تعذّرت قراءة البيانات المحفوظة لهذه المحفظة. لا تحذف هذه المحفظة ولا تمسح بيانات التطبيق، وتواصل مع الدعم لاستعادتها.
$logout_recovery_required_warning: تعذّرت قراءة البيانات المحفوظة لهذه المحفظة، لذلك لا يمكن عرض عبارات الاسترداد الخاصة بها. حذف المحفظة يمحو النسخة الوحيدة المتبقية على هذا الجهاز، ولا يمكن استعادتها بدون عبارات الاسترداد.
$logout_recovery_required_accounts_warning: تعذّرت قراءة البيانات المحفوظة لـ %links%، لذلك لا يمكن عرض عبارات الاسترداد. الحذف يمحو النسخة الوحيدة المتبقية من هذه المحافظ على هذا الجهاز، ولا يمكن استعادتها بدون عبارات الاسترداد.
$enclave_migration_interrupted_title: توقّف التحديث
$enclave_migration_interrupted_message: |
  توقّفت محاولة سابقة لتحديث بيانات محفظتك في منتصفها، ولا يمكن استئنافها من هذه الشاشة. إعادة المحاولة هنا لن تفيد.

  لا تعِد تثبيت التطبيق ولا تمسح بياناته، فمحافظك ما زالت مخزّنة على هذا الجهاز. يُرجى التواصل مع %support_link% وسنساعدك في إكمال التحديث.
$enclave_migration_unexpected_title: تعذّر إكمال التحديث
$enclave_migration_unexpected_message: |
  توقّف تحديث بيانات محفظتك بسبب خطأ غير متوقّع، ولا يستطيع التطبيق تحديد سببه. لم يُحذف أي شيء: ما زالت جميع محافظك مخزّنة على هذا الجهاز.

  أغلق هذه الرسالة وحاول مرة أخرى، فالمحاولة مرة أخرى لن تضرّ بمحافظك. إذا استمرّ التحديث في التوقّف، فلا تعِد تثبيت التطبيق ولا تمسح بياناته، وأرسل هذا الرمز إلى %support_link%: %error_code%
$enclave_migration_retry_title: لم يكتمل التحديث
$enclave_migration_retry_message: |
  توقّف تحديث بيانات محفظتك قبل اكتماله. لم يُحذف أي شيء: ما زالت جميع محافظك مخزّنة على هذا الجهاز.

  أغلق هذه الرسالة وحاول مرة أخرى، فالمحاولة مرة أخرى لن تضرّ بمحافظك. إذا استمرّ التحديث في التوقّف، فلا تعِد تثبيت التطبيق ولا تمسح بياناته، وأرسل هذا الرمز إلى %support_link%: %error_code%
$enclave_migration_storage_full_title: لا توجد مساحة كافية
$enclave_migration_storage_full_message: |
  يحتاج تحديث بيانات محفظتك إلى مساحة خالية أكبر من المساحة المتبقية على هذا الجهاز، لذلك توقّف. لم يُحذف أي شيء: ما زالت جميع محافظك مخزّنة على هذا الجهاز.

  وفّر بعض المساحة وافتح التطبيق مرة أخرى. لا تعِد تثبيت التطبيق ولا تمسح بياناته، فذلك سيمحو المحافظ التي ما زالت سليمة.
