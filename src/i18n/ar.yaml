$agent_consent_disclosure_text: من خلال النقر على "السماح للوكيل"، فإنك تسمح لـ %app_name% بإرسال رسائل الوكيل وسياق المحفظة ذات الصلة إلى وكيل %app_name% (agent.mywallet.io) وإلى موفري الذكاء الاصطناعي التابعين لجهات خارجية لدينا، OpenAI وAnthropic، لمعالجة طلباتك. قد يتضمن سياق المحفظة عناوين المحفظة والأرصدة والرموز المميزة والنشاط وتفاصيل الإجراء المطلوب. عند استخدام الإدخال الصوتي، يُرسل تسجيلك إلى Inworld، وعند الحاجة إلى ElevenLabs عبر OpenRouter، لتحويله إلى نص. يتم استخدام البيانات فقط لتوفير استجابات الوكيل وإعداد الإجراءات التي تطلبها.
$agent_consent_search_disclosure_text: عند البحث على الويب، تُرسل عبارات البحث فقط إلى OpenAI، وعند الحاجة إلى Serper؛ ولا يُرسل سياق المحفظة أو سجل المحادثة.
