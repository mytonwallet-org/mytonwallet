$domain_like_scam_warning: |-
  من المحتمل أن يكون العنوان الذي تم إدخاله **عملية احتيال**. هذا **ليس** عنوانًا لأي بورصة أو لمحفظة العملات الرقمية الخاصة بك.

  هذا **نطاق** طويل يستخدمه **المحتالون** لإقناع الأشخاص بأنهم يرسلون رموزًا مميزة إلى عنوان معروف.

  **ألغِ** عملية النقل هذه و **لا** تثق أبدًا في الغرباء. تعرف على المزيد حول هذا الأمر وغيره من عمليات الاحتيال في %help_center_link% الخاص بنا.
