$auth_responsibly_description1: "%app_name% هي محفظة **ذاتية الحراسة**، مما يعني أنك **أنت فقط** تتمتع بالتحكم الكامل، والأهم من ذلك، **المسؤولية الكاملة** عن أموالك."
$auth_responsibly_description2: تُخزّن مفاتيحك الخاصة على جهازك وقد تتعرض **لهجمات القراصنة**. إذا كان جهازك مصابًا **ببرامج ضارة**، فمن المرجح أن تُسرق أموالك.
$auth_responsibly_description3: فريق %app_name% **ليس مسؤولاً** عن سلامة أموالك، تمامًا كما أن الشركة المصنعة لجهاز الكمبيوتر الخاص بك أو مزود الإنترنت ليس مسؤولاً.
$auth_responsibly_description4: "**لا تخزّن أبدًا** كل أموالك في مكان واحد. **نوّع** واستخدم برامج وأجهزة مختلفة. احرص دائمًا على **إجراء بحثك الخاص** وتعلّم المزيد عن أمان العملات المشفرة."
