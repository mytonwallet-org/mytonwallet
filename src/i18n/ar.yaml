  لا تعِد تثبيت التطبيق ولا تمسح بياناته من إعدادات النظام. صدّر السجلات بالزر أدناه وأرسلها إلى %support_link%: سنرى من خلالها ما حدث على هذا الجهاز.

  إذا كانت لديك عبارات الاسترداد لمحافظك، يمكنك الخروج من جميع المحافظ واستيرادها من جديد.

Install the TON App on your Ledger and try again.: قم بتثبيت تطبيق TON على Ledger الخاص بك وحاول مرة أخرى.
