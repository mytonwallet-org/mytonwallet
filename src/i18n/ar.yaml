$agent_consent_disclosure_text: من خلال النقر على "السماح للوكيل"، فإنك تسمح لـ %app_name% بإرسال رسائل الوكيل وسياق المحفظة ذات الصلة إلى وكيل %app_name% (agent.mywallet.io) وAnthropic Claude API، موفر الذكاء الاصطناعي التابع لجهة خارجية، لمعالجة طلباتك. قد يتضمن سياق المحفظة عناوين المحفظة والأرصدة والرموز المميزة والنشاط وتفاصيل الإجراء المطلوب. يتم استخدام البيانات فقط لتوفير استجابات الوكيل وإعداد الإجراءات التي تطلبها.
$agent_consent_search_disclosure_text: عند البحث على الويب، قد تُرسل عبارات البحث فقط إلى Serper؛ ولا يُرسل سياق المحفظة أو سجل المحادثة.
