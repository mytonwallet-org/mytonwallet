$safety_rules_private_key_three: إذا رأى أي شخص آخر هذا المفتاح الخاص، **قد تُسرق أموالك**. **لا ترسله أو تعرضه لأي شخص**، ولا حتى للمطورين أو الدعم الفني.
$safety_rules_one: في الشاشة التالية سترى **عبارات الاسترداد**. اكتبها بالترتيب الصحيح و**خزنها في مكان آمن**.
$safety_rules_two: إنها تسمح بـ **فتح محفظتك** إذا فقدت كلمة المرور الخاصة بك أو الوصول إلى هذا الجهاز.
$safety_rules_three: إذا رأى أي شخص آخر هذه العبارات، **قد تُسرق أموالك**. **لا ترسلها لأي شخص**، ولا حتى للمطورين أو الدعم الفني.
