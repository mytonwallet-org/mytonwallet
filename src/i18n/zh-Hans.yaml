$enclave_migration_unexpected_title: 无法完成更新
$enclave_migration_unexpected_message: |
  钱包数据更新因意外错误而停止，应用无法确定错误原因。没有删除任何内容：您的所有钱包仍存储在本设备上。

  关闭此消息并重试，再次尝试不会损坏您的钱包。如果更新仍然停止，请不要重新安装应用，也不要清除其数据，并将此代码发送给 %support_link%：%error_code%
$enclave_migration_retry_title: 更新未完成
$enclave_migration_retry_message: |
  钱包数据更新在完成前停止。没有删除任何内容：您的所有钱包仍存储在本设备上。

