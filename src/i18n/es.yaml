$enclave_migration_unexpected_title: No se pudo completar la actualización
$enclave_migration_unexpected_message: |
  La actualización de los datos de su billetera se detuvo por un error inesperado y la aplicación no puede determinar la causa. No se ha eliminado nada: todas sus billeteras siguen guardadas en este dispositivo.

  Cierre este mensaje y vuelva a intentarlo; otro intento no dañará sus billeteras. Si sigue deteniéndose, no reinstale la aplicación ni borre sus datos y envíe este código a %support_link%: %error_code%
$enclave_migration_retry_title: La actualización no se completó
$enclave_migration_retry_message: |
  La actualización de los datos de su billetera se detuvo antes de completarse. No se ha eliminado nada: todas sus billeteras siguen guardadas en este dispositivo.

  Cierre este mensaje y vuelva a intentarlo; otro intento no dañará sus billeteras. Si sigue deteniéndose, no reinstale la aplicación ni borre sus datos y envíe este código a %support_link%: %error_code%
$enclave_migration_storage_full_title: No hay suficiente espacio
$enclave_migration_storage_full_message: |
  La actualización de los datos de su billetera necesita más espacio libre del que queda en este dispositivo, por lo que se detuvo. No se ha eliminado nada: todas sus billeteras siguen guardadas en este dispositivo.

  Libere espacio y vuelva a abrir la aplicación. No reinstale la aplicación ni borre sus datos: eso eliminaría las billeteras que aún están intactas.
