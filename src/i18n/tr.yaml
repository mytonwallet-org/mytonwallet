$enclave_migration_unexpected_title: Güncelleme Tamamlanamadı
$enclave_migration_unexpected_message: |
  Cüzdan verilerinizin güncellenmesi beklenmeyen bir hata nedeniyle durdu ve uygulama hatanın nedenini belirleyemiyor. Hiçbir şey silinmedi: tüm cüzdanlarınız hâlâ bu cihazda saklanıyor.

  Bu mesajı kapatıp tekrar deneyin; yeniden denemek cüzdanlarınıza zarar vermez. Güncelleme durmaya devam ederse uygulamayı yeniden yüklemeyin, verilerini temizlemeyin ve şu kodu %support_link% adresine gönderin: %error_code%
$enclave_migration_retry_title: Güncelleme Tamamlanmadı
$enclave_migration_retry_message: |
  Cüzdan verilerinizin güncellenmesi tamamlanmadan durdu. Hiçbir şey silinmedi: tüm cüzdanlarınız hâlâ bu cihazda saklanıyor.

  Bu mesajı kapatıp tekrar deneyin; yeniden denemek cüzdanlarınıza zarar vermez. Güncelleme durmaya devam ederse uygulamayı yeniden yüklemeyin, verilerini temizlemeyin ve şu kodu %support_link% adresine gönderin: %error_code%
$enclave_migration_storage_full_title: Yeterli Alan Yok
$enclave_migration_storage_full_message: |
  Cüzdan verilerinizin güncellenmesi için bu cihazda kalan alandan daha fazla boş alan gerekiyor, bu yüzden güncelleme durdu. Hiçbir şey silinmedi: tüm cüzdanlarınız hâlâ bu cihazda saklanıyor.

  Biraz yer açıp uygulamayı yeniden açın. Uygulamayı yeniden yüklemeyin ve verilerini temizlemeyin; bunu yapmak hâlâ sağlam olan cüzdanları siler.
